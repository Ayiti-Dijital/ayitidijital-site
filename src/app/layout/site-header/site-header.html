<header class="bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
    <a routerLink="/" class="rounded" aria-label="Ayiti Dijital – paj dakèy">
      <img
        src="brand/lockup-h-light.svg"
        alt="Ayiti Dijital"
        width="216"
        height="60"
        class="h-auto w-44 sm:w-54"
      />
    </a>
    <div class="hidden w-full max-w-md lg:block">
      <ad-search-preview inputId="mo" />
    </div>
    <button
      type="button"
      class="grid size-11 place-items-center rounded-md text-ink ring-1 ring-line lg:hidden"
      aria-controls="meni-prensipal"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      <span class="sr-only">Meni</span>
      <svg
        aria-hidden="true"
        viewBox="0 0 24 24"
        class="size-6"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6 6 18" />
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" />
        }
      </svg>
    </button>
  </div>

  <div class="px-4 pb-4 sm:px-6 lg:hidden">
    <ad-search-preview inputId="mo-mobil" />
  </div>

  <nav
    id="meni-prensipal"
    aria-label="Navigasyon prensipal"
    class="border-y border-line lg:block lg:border-t-0"
    [class.hidden]="!menuOpen()"
  >
    <ul
      class="mx-auto flex max-w-6xl flex-col px-4 text-sm tracking-wide uppercase sm:px-6 lg:flex-row lg:flex-wrap lg:justify-center"
    >
      @for (item of menu; track item.label) {
        <li>
          @if (item.path) {
            <a
              [routerLink]="item.path"
              routerLinkActive="!border-link !text-link"
              ariaCurrentWhenActive="page"
              (click)="menuOpen.set(false)"
              class="block border-b border-line px-2 py-3 text-ink hover:text-link lg:border-b-2 lg:border-transparent lg:px-3"
              >{{ item.label }}</a
            >
          } @else {
            <a
              [href]="item.href"
              class="block border-b border-line px-2 py-3 text-ink hover:text-link lg:border-b-2 lg:border-transparent lg:px-3"
              >{{ item.label }}</a
            >
          }
        </li>
      }
    </ul>
  </nav>
</header>
