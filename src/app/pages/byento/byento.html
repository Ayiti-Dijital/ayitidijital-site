<ad-breadcrumb [items]="crumbs()" />

<div class="mx-auto max-w-6xl px-4 sm:px-6">
  <section class="card mt-2 p-8 sm:p-12" aria-labelledby="tit-paj">
    <div class="flex flex-col items-center text-center">
      <ad-icon [name]="icon()" class="size-16 text-link" />
      <span
        class="mt-5 rounded bg-gold px-2.5 py-0.5 text-xs font-bold tracking-wider text-navy-deep uppercase"
        >Byento</span
      >
      <h1 id="tit-paj" class="mt-3 text-3xl tracking-wide text-link uppercase">{{ heading() }}</h1>
      <p class="mt-3 max-w-2xl leading-relaxed">{{ text() }}</p>
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <a
          [href]="helpHref()"
          class="rounded-full bg-link px-6 py-2.5 font-semibold text-white hover:bg-navy"
          >Ou vle ede? Ekri nou</a
        >
        <a
          routerLink="/"
          class="rounded-full px-6 py-2.5 font-semibold text-link ring-1 ring-link/40 hover:bg-mist"
          >Retounen nan paj dakèy</a
        >
      </div>
    </div>
  </section>
</div>
